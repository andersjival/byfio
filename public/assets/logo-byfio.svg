<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4AEFA" />
      <stop offset="100%" stop-color="#E7B8F9" />
    </linearGradient>
  </defs>

  <!-- Fondo degradado lila pastel exacto al original -->
  <rect width="1000" height="1000" rx="160" fill="url(#bgGrad)" />

  <!-- Grupo del Logo by.fio en trazos vectoriales puros -->
  <g transform="translate(0, 15)">
    <!-- Letra "b" -->
    <path d="M 145 335 L 145 575" stroke="#FFFFFF" stroke-width="50" stroke-linecap="round" />
    <circle cx="208" cy="512" r="65" fill="none" stroke="#FFFFFF" stroke-width="48" />

    <!-- Letra "y" -->
    <path d="M 332 450 L 385 572" stroke="#FFFFFF" stroke-width="50" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 438 450 L 372 615 Q 355 655 322 652" fill="none" stroke="#FFFFFF" stroke-width="50" stroke-linecap="round" />

    <!-- Corazón Celeste Central -->
    <path d="M 490 562 C 490 546, 465 536, 454 550 C 442 565, 452 586, 490 612 C 528 586, 538 565, 526 550 C 515 536, 490 546, 490 562 Z" fill="#9BE4FF" />

    <!-- Letra "f" -->
    <path d="M 628 380 C 600 368, 572 385, 572 425 L 572 575" fill="none" stroke="#FFFFFF" stroke-width="50" stroke-linecap="round" />
    <path d="M 542 455 L 610 455" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round" />

    <!-- Letra "i" (tallo) -->
    <path d="M 668 455 L 668 575" stroke="#FFFFFF" stroke-width="50" stroke-linecap="round" />

    <!-- Letra "o" -->
    <circle cx="798" cy="512" r="65" fill="none" stroke="#FFFFFF" stroke-width="48" />

    <!-- Estrella Amarilla sobre la "i" (inclinada 12 deg) -->
    <g transform="translate(696, 385) rotate(12)">
      <path d="M 0 -44 L 12 -14 L 44 -10 L 20 12 L 26 43 L 0 28 L -26 43 L -20 12 L -44 -10 L -12 -14 Z" fill="#FFF07C" stroke="#FFF07C" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" />
    </g>
  </g>
</svg>
